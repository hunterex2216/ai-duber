name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          for i in 1 2 3; do
            "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" && break
            echo "SDK retry $i"; sleep 5
          done || true

      - name: Detect Gradle version
        id: gv
        run: |
          GV=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GV=$(sed -n 's/.*gradle-\([0-9][0-9.]*[0-9]\)-\(bin\|all\)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          fi
          [ -n "$GV" ] || GV="9.3.1"
          echo "version=$GV" >> "$GITHUB_OUTPUT"
          echo "Gradle: $GV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Prepare .env and keystore
        env:
          # Optional but RECOMMENDED: repo Settings -> Secrets -> Actions -> DEBUG_KEYSTORE_BASE64
          # (base64 of your debug.keystore). Keeps the APK SHA-1 identical on every build, so
          # Google Drive / Google sign-in keeps working without re-registering a new SHA-1.
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ] && [ ! -f debug.keystore.base64 ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" > debug.keystore.base64
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          # Decode the REAL debug keystore so the APK SHA-1 matches Google Cloud (Gmail sign-in fix)
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "debug.keystore decoded from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "::warning::No keystore secret/file found - generating a random keystore. Google Drive sign-in will FAIL until this build's SHA-1 is added in Google Cloud. Add the DEBUG_KEYSTORE_BASE64 secret to keep one SHA-1 forever."
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "---- keystore SHA-1 (must be a0:ce:22:dd:11:e0:a9:f2:01:b6:15:8b:e7:20:4f:d7:5b:cb:93:a1) ----"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA-1" || true
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" >> gradle.properties

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "=================== ERROR SUMMARY ==================="
            grep -n -A25 "What went wrong" build.log | head -70
            echo "---------------- compile errors ----------------"
            grep -n -E "^e: |error:" build.log | head -30
            echo "---------------- last lines ----------------"
            tail -30 build.log
            exit $CODE
          fi
          tail -5 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Forge-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload full build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
